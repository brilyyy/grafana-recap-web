[project]
name = "sr-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bptx",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
bptx = { path = "../bptx", editable = true }

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "watchdog>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = []

[tool.ruff.lint.per-file-ignores]
"src/api.py" = ["E402"]
